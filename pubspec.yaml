name: lyrical
description: "Anonymous poetry mobile platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.16.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  flutter_dotenv: ^6.0.1
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1
  intl: 0.20.2
  uuid: ^4.6.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - logo/lyrical.png
    - logo/lyrical_mark.png
    - logo/lyrical_app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: logo/lyrical_app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: logo/lyrical_app_icon.png
  background_color_ios: "#FFFFFF"
  web:
    generate: true
    image_path: logo/lyrical_app_icon.png
    background_color: "#FFFFFF"
    theme_color: "#1F3A32"
  windows:
    generate: true
    image_path: logo/lyrical_app_icon.png
  macos:
    generate: true
    image_path: logo/lyrical_app_icon.png

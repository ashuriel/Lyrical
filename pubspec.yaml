name: lyrical
description: "Anonymous poetry mobile platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.16.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  flutter_dotenv: ^6.0.1
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1
  intl: 0.20.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
